<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="theme-color" content="#f3f4f9">
<title>Dashboard Semanal - Visão da Gestão</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<style>
  body{font-family:'Inter',sans-serif;background-color:#f3f4f9;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(138,58,255,.10) 0%, transparent 20%),
      radial-gradient(circle at 90% 80%, rgba(255,126,0,.10) 0%, transparent 20%),
      radial-gradient(circle at 50% 50%, rgba(138,58,255,.05) 0%, transparent 40%);
    min-height:100vh; overflow-x:hidden}
  .bg-shape{position:fixed;z-index:-1;filter:blur(40px);opacity:.4}
  .soft-card{background:rgba(255,255,255,.9);border-radius:24px;
    box-shadow:0 10px 25px -5px rgba(0,0,0,.05),0 8px 10px -6px rgba(0,0,0,.05);
    border:1px solid rgba(255,255,255,.8)}
  .no-scrollbar::-webkit-scrollbar{display:none}
</style>
</head>
<body class="p-4 md:p-8">
<div class="bg-shape top-10 left-[-5%] w-64 h-64 bg-purple-400 rounded-full"></div>
<div class="bg-shape bottom-20 right-[-5%] w-80 h-80 bg-orange-400 rounded-full"></div>

<div class="max-w-6xl mx-auto space-y-6" id="app">
  <div class="soft-card p-10 text-center text-gray-500">Carregando as semanas…</div>
</div>

<script>
/* ============ CONFIG ============ */
const SHEET_ID = '1kFVP2oocRi0zsofaK9BihRbnpCo_nyM0R28wARnQu1A';
const TAB = '3_Dashboard_Semanal';

function norm(s){ return String(s??'').trim().toLowerCase(); }

async function buscarAba(tab){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
  const res = await fetch(url);
  const raw = await res.text();
  const jsonText = raw.substring(raw.indexOf('{'), raw.lastIndexOf('}')+1);
  const data = JSON.parse(jsonText);
  if(data.status==='error') throw new Error(JSON.stringify(data.errors));
  return data.table;
}

/* Acha a linha/coluna de cabeçalho ancorando por "Pessoa" — cobre tanto o
   caso do Google auto-detectar cabeçalho (vira table.cols[].label) quanto o
   caso dele continuar como linha normal dentro de "rows". Essa aba tem
   cabeçalho em 2 níveis (linha "SEMANA 1/2/3..." + linha "Meta/Real/%" logo
   abaixo), então depois de achar "Pessoa" ainda pulamos linhas de sub-
   cabeçalho até achar a 1ª linha que já é dado de verdade. */
function acharAncoraPessoa(table){
  const rows = table.rows, C = table.cols.length;
  const val=(r,c)=>{const x=rows[r]&&rows[r].c[c];return x?(x.f??x.v??''):''};
  const colLabelsNorm = table.cols.map(c => norm(c.label));
  const tokensSubCabecalho = ['meta','real','realizado','%','projeção','projecao','status'];

  function primeiraLinhaDeDado(colPessoa, r0){
    let r = r0;
    const limite = Math.min(rows.length, r0+5);
    while(r < limite){
      const v = norm(val(r, colPessoa+1));
      if(tokensSubCabecalho.includes(v)){ r++; continue; }
      break;
    }
    return r;
  }

  const colPessoaExato = colLabelsNorm.findIndex(l => l==='pessoa');
  if(colPessoaExato>=0){
    return {colPessoa:colPessoaExato, dataStartRow: primeiraLinhaDeDado(colPessoaExato, 0)};
  }
  const limite = Math.min(rows.length,40);
  for(let r=0;r<limite;r++){
    for(let c=0;c<C;c++){
      if(norm(val(r,c))==='pessoa'){
        return {colPessoa:c, dataStartRow: primeiraLinhaDeDado(c, r+1)};
      }
    }
  }
  const colPessoaAuto = colLabelsNorm.findIndex(l => l.includes('pessoa'));
  if(colPessoaAuto>=0){
    return {colPessoa:colPessoaAuto, dataStartRow: primeiraLinhaDeDado(colPessoaAuto, 0)};
  }
  for(let r=0;r<limite;r++){
    for(let c=0;c<C;c++){
      if(norm(val(r,c)).includes('pessoa')){
        return {colPessoa:c, dataStartRow: primeiraLinhaDeDado(c, r+1)};
      }
    }
  }
  return null;
}

function montarDump(table){
  const rows = table.rows, C = table.cols.length;
  const val=(r,c)=>{const x=rows[r]&&rows[r].c[c];return x?(x.f??x.v??''):''};
  const dump = [];
  dump.push('--- table.cols (rótulos de coluna crus) ---');
  table.cols.forEach((c,i)=>{ dump.push(`col ${i}: id="${c.id}" label=${JSON.stringify(c.label)} type=${c.type}`); });
  dump.push('');
  dump.push('--- primeiras linhas de table.rows ---');
  for(let r=0;r<Math.min(rows.length,25);r++){
    const linha = [];
    for(let c=0;c<Math.min(C,20);c++) linha.push(val(r,c) || '·');
    dump.push(`L${r}: ${linha.join(' | ')}`);
  }
  return dump.join('\n');
}

/* ============ PARSER ============
   Estrutura fixa da planilha: depois da coluna "Pessoa" vêm 5 grupos de 3
   colunas (Meta/Real/%) — uma por semana — e por fim mais 3 colunas
   (Meta/Projeção/Status) com o total do mês. Isso não depende de conseguir
   ler o cabeçalho de 2 níveis, só da posição relativa à coluna "Pessoa". */
function parseSemanal(table){
  const rows = table.rows;
  const cell=(r,c)=>(rows[r]&&rows[r].c[c])?rows[r].c[c]:null;
  const val=(r,c)=>{const x=cell(r,c);return x?(x.f??x.v??''):''};
  const rawnum=(r,c)=>{const x=cell(r,c);if(!x)return null;const n=typeof x.v==='number'?x.v:parseFloat(String(x.v).replace(',','.'));return isNaN(n)?null:n};

  const ancora = acharAncoraPessoa(table);
  if(!ancora){
    const err = new Error('Cabeçalho "Pessoa" não encontrado nessa aba (nem nos títulos das colunas, nem no conteúdo)');
    err.dump = montarDump(table);
    throw err;
  }
  const {colPessoa, dataStartRow} = ancora;

  const pessoas = [];
  for(let r=dataStartRow;r<rows.length;r++){
    const nome = val(r,colPessoa);
    if(nome===''||nome==null) break;
    if(norm(nome)==='total') continue;

    const semanas = [];
    for(let s=0;s<5;s++){
      const cMeta = colPessoa+1+s*3, cReal=cMeta+1, cPct=cMeta+2;
      semanas.push({
        meta: val(r,cMeta), real: val(r,cReal), pct: val(r,cPct),
        pctNum: rawnum(r,cPct)
      });
    }
    const cMetaTotal = colPessoa+16, cProjTotal = colPessoa+17, cStatusTotal = colPessoa+18;
    pessoas.push({
      nome, semanas,
      total: { meta: val(r,cMetaTotal), projecao: val(r,cProjTotal), status: val(r,cStatusTotal) }
    });
  }
  return pessoas;
}

/* ============ mesma paleta da página Individual/Mensal ============ */
function corPct(pctNum){
  if(pctNum==null) return {bg:'#f3f4f6', ink:'#6b7280'};
  if(pctNum>=1) return {bg:'#d1fae5', ink:'#047857'};
  if(pctNum>=0.7) return {bg:'#fef3c7', ink:'#b45309'};
  return {bg:'#fee2e2', ink:'#b91c1c'};
}

function mesAtualExtenso(){
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const d = new Date();
  return meses[d.getMonth()] + '/' + d.getFullYear();
}

/* ============ RENDER ============ */
function render(pessoas){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="rounded-xl shadow-lg mb-2 flex items-center justify-between px-4 py-3"
      style="background:linear-gradient(90deg,#8a3aff 0%,#ff7e00 100%)">
      <div>
        <p class="text-white/80 text-xs font-semibold uppercase tracking-wide">Visão da gestão</p>
        <p class="text-white text-lg font-extrabold leading-tight">Dashboard Semanal</p>
      </div>
      <p class="text-white text-sm font-bold">${mesAtualExtenso()}</p>
    </header>

    <nav class="flex gap-2 flex-wrap px-1">
      <a href="metas-index.html" class="text-xs font-bold px-3 py-2 rounded-full bg-gray-100 text-gray-600 hover:bg-violet-50">Individual</a>
      <a href="dashboard-mensal.html" class="text-xs font-bold px-3 py-2 rounded-full bg-gray-100 text-gray-600 hover:bg-violet-50">Mensal</a>
      <a href="dashboard-semanal.html" class="text-xs font-bold px-3 py-2 rounded-full bg-violet-600 text-white">Semanal</a>
    </nav>

    <div class="soft-card p-6 overflow-x-auto no-scrollbar">
      <table class="w-full border-collapse" style="min-width:760px">
        <thead>
          <tr class="border-b border-gray-100">
            <th class="text-left text-[11px] font-bold text-gray-400 uppercase tracking-wide pb-3 pl-2">Pessoa</th>
            <th class="text-[11px] font-bold text-gray-400 uppercase tracking-wide pb-3 text-center">Semana 1</th>
            <th class="text-[11px] font-bold text-gray-400 uppercase tracking-wide pb-3 text-center">Semana 2</th>
            <th class="text-[11px] font-bold text-gray-400 uppercase tracking-wide pb-3 text-center">Semana 3</th>
            <th class="text-[11px] font-bold text-gray-400 uppercase tracking-wide pb-3 text-center">Semana 4</th>
            <th class="text-[11px] font-bold text-gray-400 uppercase tracking-wide pb-3 text-center">Semana 5</th>
            <th class="text-[11px] font-bold text-violet-600 uppercase tracking-wide pb-3 text-center">Total do mês</th>
          </tr>
        </thead>
        <tbody>
          ${pessoas.map(p=>{
            const semanasHtml = p.semanas.map(s=>{
              const c = corPct(s.pctNum);
              return `<td class="py-3 px-1 text-center">
                <div class="rounded-xl py-2" style="background:${c.bg}">
                  <p class="font-bold text-sm" style="color:${c.ink}">${s.real || 0}</p>
                  <p class="text-[10px] text-gray-400">meta ${s.meta ?? '—'}</p>
                  <p class="text-[10px] font-bold" style="color:${c.ink}">${s.pct ?? ''}</p>
                </div>
              </td>`;
            }).join('');
            return `<tr class="border-b border-gray-100 last:border-b-0">
              <td class="py-3 pl-2 font-bold text-gray-800 whitespace-nowrap">${p.nome}</td>
              ${semanasHtml}
              <td class="py-3 px-1 text-center">
                <p class="font-black text-base text-gray-900">${p.total.projecao ?? '—'} <span class="text-base">${p.total.status||''}</span></p>
                <p class="text-[10px] text-gray-400">meta ${p.total.meta ?? '—'}</p>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>

    <div class="flex gap-4 flex-wrap px-1 text-[11px] font-semibold text-gray-500">
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-emerald-500 inline-block"></span>Meta batida (≥100%)</span>
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-amber-400 inline-block"></span>Perto (70–99%)</span>
      <span class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-sm bg-red-500 inline-block"></span>Abaixo (&lt;70%)</span>
    </div>

    <div class="text-center text-xs text-gray-400 pb-4">Semanas futuras aparecem com % baixo naturalmente — ainda não deu tempo de realizar. A coluna final usa a projeção (no ritmo atual) como número principal.</div>
  `;
}

/* ============ CARREGAR ============ */
async function carregar(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="soft-card p-10 text-center text-gray-500">Carregando as semanas…</div>';
  try{
    const table = await buscarAba(TAB);
    const pessoas = parseSemanal(table);
    render(pessoas);
  }catch(e){
    const dentroDeIframe = (function(){ try{ return window.self !== window.top; }catch(_){ return true; } })();
    const dicaSandbox = dentroDeIframe
      ? `<p class="mt-3 text-sm text-gray-600"><b>Isso é esperado dentro do preview do Claude:</b> por segurança, o Claude bloqueia chamadas de rede externas de dentro do artifact. Essa tela só vai puxar dados de verdade fora daqui — publicada (ex: GitHub Pages).</p>`
      : '';
    const urlBruta = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(TAB)}`;
    app.innerHTML = `<div class="soft-card p-8 text-red-600">
      Não consegui ler o Dashboard Semanal.<br><br>${e.message}
      ${dicaSandbox}<br>
      <a href="${urlBruta}" target="_blank" class="text-violet-600 font-bold underline">abrir resposta crua da planilha (aba ${TAB})</a>
      ${e.dump ? `<br><br><pre class="text-left whitespace-pre-wrap text-[10px] bg-gray-100 p-3 rounded-lg mt-2">${e.dump}</pre>` : ''}
    </div>`;
  }
}

carregar();
</script>
</body>
</html>
