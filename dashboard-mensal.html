<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="theme-color" content="#f3f4f9">
<title>Dashboard Mensal - Visão da Gestão</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{font-family:'Inter',sans-serif;background-color:#f3f4f9;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(138,58,255,.10) 0%, transparent 20%),
      radial-gradient(circle at 90% 80%, rgba(255,126,0,.10) 0%, transparent 20%),
      radial-gradient(circle at 50% 50%, rgba(138,58,255,.05) 0%, transparent 40%);
    min-height:100vh; overflow-x:hidden}
  .bg-shape{position:fixed;z-index:-1;filter:blur(40px);opacity:.4}
  .soft-card{background:rgba(255,255,255,.9);border-radius:24px;
    box-shadow:0 10px 25px -5px rgba(0,0,0,.05),0 8px 10px -6px rgba(0,0,0,.05);
    border:1px solid rgba(255,255,255,.8)}
  .progress-ring-circle{transition:stroke-dashoffset .8s cubic-bezier(.16,1,.3,1);
    transform:rotate(-90deg);transform-origin:50% 50%}
</style>
</head>
<body class="p-4 md:p-8">
<div class="bg-shape top-10 left-[-5%] w-64 h-64 bg-purple-400 rounded-full"></div>
<div class="bg-shape bottom-20 right-[-5%] w-80 h-80 bg-orange-400 rounded-full"></div>

<div class="max-w-6xl mx-auto space-y-6" id="app">
  <div class="soft-card p-10 text-center text-gray-500">Carregando o mês…</div>
</div>

<script>
/* ============ CONFIG ============ */
const SHEET_ID = '1kFVP2oocRi0zsofaK9BihRbnpCo_nyM0R28wARnQu1A';
const TAB = '2_Dashboard_Mensal';

function norm(s){ return String(s??'').trim().toLowerCase(); }

/* ============ FETCH ============ */
async function buscarAba(tab){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
  const res = await fetch(url);
  const raw = await res.text();
  const jsonText = raw.substring(raw.indexOf('{'), raw.lastIndexOf('}')+1);
  const data = JSON.parse(jsonText);
  if(data.status==='error') throw new Error(JSON.stringify(data.errors));
  return data.table;
}

/* ============ ACHAR COLUNA "PESSOA" ============
   O Google atribui UM tipo por coluna (baseado na maioria dos dados dela).
   Nas colunas de número (Meta mês, Realizado, Bônus apurado...) qualquer
   texto que caia ali é DESCARTADO — só sobrevivem como texto as colunas
   que são texto o tempo todo (Pessoa, Status, Mensagem). Por isso achamos
   "Pessoa" e usamos posição relativa a ela pra tudo o mais. */
function acharColPessoa(table){
  const rows = table.rows, C = table.cols.length;
  const val=(r,c)=>{const x=rows[r]&&rows[r].c[c];return x?(x.f??x.v??''):''};
  const colLabelsNorm = table.cols.map(c => norm(c.label));

  let colPessoa = colLabelsNorm.findIndex(l => l==='pessoa');
  if(colPessoa>=0) return {colPessoa, dataStartRow:0};

  const limite = Math.min(rows.length,40);
  for(let r=0;r<limite;r++){
    for(let c=0;c<C;c++){ if(norm(val(r,c))==='pessoa'){ return {colPessoa:c, dataStartRow:r+1}; } }
  }
  colPessoa = colLabelsNorm.findIndex(l => l.includes('pessoa'));
  if(colPessoa>=0) return {colPessoa, dataStartRow:0};
  for(let r=0;r<limite;r++){
    for(let c=0;c<C;c++){ if(norm(val(r,c)).includes('pessoa')){ return {colPessoa:c, dataStartRow:r+1}; } }
  }
  return null;
}

function montarDump(table){
  const rows = table.rows, C = table.cols.length;
  const val=(r,c)=>{const x=rows[r]&&rows[r].c[c];return x?(x.f??x.v??''):''};
  const dump = [];
  dump.push('--- table.cols (rótulos de coluna crus) ---');
  table.cols.forEach((c,i)=>{ dump.push(`col ${i}: id="${c.id}" label=${JSON.stringify(c.label)} type=${c.type}`); });
  dump.push('');
  dump.push('--- primeiras linhas de table.rows ---');
  for(let r=0;r<Math.min(rows.length,25);r++){
    const linha = [];
    for(let c=0;c<Math.min(C,14);c++) linha.push(val(r,c) || '·');
    dump.push(`L${r}: ${linha.join(' | ')}`);
  }
  return dump.join('\n');
}

/* ============ PARSER ============
   Estrutura fixa da planilha: a partir da coluna "Pessoa" — Meta mês,
   Realizado, % atingido, Projeção, % projeção, Status, Bônus apurado,
   Faltas, Penalidade, A ser Pago, Bônus máximo, Mensagem. */
function parseMensal(table){
  const rows = table.rows;
  const cell=(r,c)=>(rows[r]&&rows[r].c[c])?rows[r].c[c]:null;
  const val=(r,c)=>{const x=cell(r,c);return x?(x.f??x.v??''):''};
  const rawnum=(r,c)=>{const x=cell(r,c);if(!x)return null;const n=typeof x.v==='number'?x.v:parseFloat(String(x.v).replace(',','.'));return isNaN(n)?null:n};

  const ancora = acharColPessoa(table);
  if(!ancora){
    const err = new Error('Cabeçalho "Pessoa" não encontrado nessa aba (nem nos títulos das colunas, nem no conteúdo)');
    err.dump = montarDump(table);
    throw err;
  }
  const {colPessoa, dataStartRow} = ancora;
  const colMeta=colPessoa+1, colReal=colPessoa+2, colPct=colPessoa+3, colProj=colPessoa+4,
        colPctProj=colPessoa+5, colStatus=colPessoa+6, colBonusApurado=colPessoa+7,
        colFaltas=colPessoa+8, colPenalidade=colPessoa+9, colASerPago=colPessoa+10,
        colBonusMax=colPessoa+11, colMsg=colPessoa+12;

  const pessoas = [];
  let totalASerPago = null;
  let linhaVisaoGeral = -1;
  for(let r=0;r<dataStartRow;r++){
    if(norm(val(r,colPessoa))==='mês'){ linhaVisaoGeral = r; break; }
  }
  for(let r=dataStartRow;r<rows.length;r++){
    const nome = val(r,colPessoa);
    if(nome===''||nome==null) break;
    if(norm(nome)==='total'){
      totalASerPago = val(r,colASerPago) || null;
      continue;
    }
    pessoas.push({
      nome,
      meta: val(r,colMeta), realizado: val(r,colReal),
      pct: val(r,colPct)||null, pctNum: rawnum(r,colPct),
      projecao: val(r,colProj), pctProjecao: val(r,colPctProj)||null,
      status: val(r,colStatus),
      bonusApurado: val(r,colBonusApurado)||null,
      faltas: rawnum(r,colFaltas),
      penalidade: val(r,colPenalidade)||null,
      aSerPago: val(r,colASerPago)||null,
      bonusMax: val(r,colBonusMax)||null,
      mensagem: val(r,colMsg)
    });
  }

  const visaoGeral = {
    pctDecorrido: linhaVisaoGeral>=0 ? (val(linhaVisaoGeral,colPct)||null) : null,
    faturamentoMeta: linhaVisaoGeral>=0 ? (val(linhaVisaoGeral,colPctProj)||null) : null,
    bonusTotalPossivel: linhaVisaoGeral>=0 ? (val(linhaVisaoGeral,colBonusApurado)||null) : null,
    totalApurado: linhaVisaoGeral>=0 ? (val(linhaVisaoGeral,colBonusMax)||null) : null,
    totalASerPago
  };

  return {visaoGeral, pessoas};
}

function mesAtualExtenso(){
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const d = new Date();
  return meses[d.getMonth()] + '/' + d.getFullYear();
}

/* ============ mesma paleta/ícones da página Individual ============ */
function statusDe(status){
  if((status||'').includes('🟢')) return {cor:'emerald', hex:'#10b981', bg:'#d1fae5', ink:'#047857'};
  if((status||'').includes('🔴')) return {cor:'red', hex:'#ef4444', bg:'#fee2e2', ink:'#b91c1c'};
  return {cor:'amber', hex:'#f59e0b', bg:'#fef3c7', ink:'#b45309'};
}
const ICONE_CHECK = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/></svg>`;
const ICONE_X = `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/></svg>`;
const ICONE_ANDAMENTO = `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M13.492 10.39c-1.381 0-2.5 1.119-2.5 2.5s1.119 2.5 2.5 2.5 2.5-1.119 2.5-2.5-1.119-2.5-2.5-2.5zm.008 4c-.827 0-1.5-.673-1.5-1.5s.673-1.5 1.5-1.5 1.5.673 1.5 1.5-.673 1.5-1.5 1.5z"/><path d="M19.03 12c0-3.059-2.471-5.53-5.53-5.53s-5.53 2.471-5.53 5.53c0 1.488.587 2.84 1.543 3.844l-1.493 1.493C6.772 16.035 6 14.108 6 12c0-4.411 3.589-8 8-8s8 3.589 8 8c0 2.108-.772 4.035-2.02 5.337l-1.493-1.493c.956-1.004 1.543-2.356 1.543-3.844z"/></svg>`;
function iconeDe(status){
  if((status||'').includes('🟢')) return ICONE_CHECK;
  if((status||'').includes('🔴')) return ICONE_X;
  return ICONE_ANDAMENTO;
}
function svgRing(pct, corHex, size=52, stroke=5){
  const r = (size/2)-stroke;
  const C = 2*Math.PI*r;
  const off = C - Math.max(0,Math.min(pct,1))*C;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="transparent" stroke="#e5e7eb" stroke-width="${stroke}"/>
    <circle class="progress-ring-circle" cx="${size/2}" cy="${size/2}" r="${r}" fill="transparent"
      stroke="${corHex}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
  </svg>`;
}

/* ============ CARD DE PESSOA ============ */
function cardPessoa(p){
  const st = statusDe(p.status);
  return `
  <div class="soft-card p-6 flex flex-col">
    <div class="flex items-center justify-between mb-5">
      <h2 class="text-xl font-bold text-gray-800">${p.nome}</h2>
      <div class="relative flex items-center justify-center flex-shrink-0">
        ${svgRing(p.pctNum||0, st.hex)}
        <span class="absolute text-[10px] font-bold text-gray-700">${p.pct||''}</span>
      </div>
    </div>
    <div class="grid grid-cols-3 gap-2 text-center mb-5">
      <div><p class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter">Meta</p><p class="font-bold text-gray-800">${p.meta ?? '—'}</p></div>
      <div><p class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter">Realizado</p><p class="font-bold text-gray-800">${p.realizado ?? '—'}</p></div>
      <div><p class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter">Projeção</p><p class="font-bold text-gray-800">${p.projecao ?? '—'}</p></div>
    </div>
    <div class="grid grid-cols-3 gap-2 mb-4">
      <div class="text-center">
        <p class="text-[9px] font-bold text-gray-400 uppercase mb-1">Apurado</p>
        <div class="bg-violet-50 rounded-xl py-2.5 font-bold text-gray-800 text-sm">${p.bonusApurado ?? '—'}</div>
      </div>
      <div class="text-center">
        <p class="text-[9px] font-bold text-gray-400 uppercase mb-1">A Pagar</p>
        <div class="bg-orange-50 rounded-xl py-2.5 font-bold text-gray-800 text-sm">${p.aSerPago || 'R$ 0'}</div>
      </div>
      <div class="text-center">
        <p class="text-[9px] font-bold text-gray-400 uppercase mb-1">Máximo</p>
        <div class="bg-violet-50 rounded-xl py-2.5 font-bold text-gray-800 text-sm">${p.bonusMax ?? '—'}</div>
      </div>
    </div>
    ${p.faltas ? `<div class="text-xs font-bold text-red-600 bg-red-50 rounded-lg py-2 px-3 text-center mb-3">⚠️ ${p.faltas} falta(s) no mês — desconto de ${p.penalidade||'—'}</div>` : ''}
    <div class="rounded-xl px-4 py-3 flex items-center gap-3 mt-auto" style="background:${st.bg}">
      <div class="rounded-full w-7 h-7 flex items-center justify-center text-white flex-shrink-0" style="background:${st.hex}">${iconeDe(p.status)}</div>
      <p class="text-sm font-semibold" style="color:${st.ink}">${p.mensagem || ''}</p>
    </div>
  </div>`;
}

/* ============ RENDER ============ */
function render(dados){
  const {visaoGeral, pessoas} = dados;
  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="rounded-xl shadow-lg mb-2 flex items-center justify-between px-4 py-3"
      style="background:linear-gradient(90deg,#8a3aff 0%,#ff7e00 100%)">
      <div>
        <p class="text-white/80 text-xs font-semibold uppercase tracking-wide">Visão da gestão</p>
        <p class="text-white text-lg font-extrabold leading-tight">Dashboard Mensal</p>
      </div>
      <div class="text-right">
        <p class="text-white text-sm font-bold">${mesAtualExtenso()}</p>
        ${visaoGeral.pctDecorrido ? `<p class="text-white/70 text-[11px] font-semibold">${visaoGeral.pctDecorrido} do mês decorrido</p>` : ''}
      </div>
    </header>

    <nav class="flex gap-2 flex-wrap px-1">
      <a href="index.html" class="text-xs font-bold px-3 py-2 rounded-full bg-gray-100 text-gray-600 hover:bg-violet-50">Individual</a>
      <a href="dashboard-mensal.html" class="text-xs font-bold px-3 py-2 rounded-full bg-violet-600 text-white">Mensal</a>
      <a href="dashboard-semanal.html" class="text-xs font-bold px-3 py-2 rounded-full bg-gray-100 text-gray-600 hover:bg-violet-50">Semanal</a>
    </nav>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
      <div class="soft-card p-6">
        <h3 class="text-gray-700 font-bold text-sm mb-2">Faturamento Meta</h3>
        <p class="text-3xl font-black text-gray-900">${visaoGeral.faturamentoMeta ?? '—'}</p>
      </div>
      <div class="soft-card p-6">
        <h3 class="text-gray-700 font-bold text-sm mb-2">Bônus Total Possível</h3>
        <p class="text-3xl font-black text-gray-900">${visaoGeral.bonusTotalPossivel ?? '—'}</p>
      </div>
      <div class="soft-card p-6">
        <h3 class="text-gray-700 font-bold text-sm mb-2">Total Apurado</h3>
        <p class="text-3xl font-black text-violet-600">${visaoGeral.totalApurado ?? '—'}</p>
      </div>
      <div class="soft-card p-6">
        <h3 class="text-gray-700 font-bold text-sm mb-2">Total a Pagar</h3>
        <p class="text-3xl font-black text-gray-900">${visaoGeral.totalASerPago ?? '—'}</p>
      </div>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      ${pessoas.map(cardPessoa).join('')}
    </div>

    <div class="text-center text-xs text-gray-400 pb-4">Dados direto da planilha · "A pagar" já considera o desconto de faltas (se houver)</div>
  `;
}

/* ============ CARREGAR ============ */
async function carregar(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="soft-card p-10 text-center text-gray-500">Carregando o mês…</div>';
  try{
    const table = await buscarAba(TAB);
    const dados = parseMensal(table);
    render(dados);
  }catch(e){
    const dentroDeIframe = (function(){ try{ return window.self !== window.top; }catch(_){ return true; } })();
    const dicaSandbox = dentroDeIframe
      ? `<p class="mt-3 text-sm text-gray-600"><b>Isso é esperado dentro do preview do Claude:</b> por segurança, o Claude bloqueia chamadas de rede externas de dentro do artifact. Essa tela só vai puxar dados de verdade fora daqui — publicada (ex: GitHub Pages).</p>`
      : '';
    const urlBruta = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(TAB)}`;
    app.innerHTML = `<div class="soft-card p-8 text-red-600">
      Não consegui ler o Dashboard Mensal.<br><br>${e.message}
      ${dicaSandbox}<br>
      <a href="${urlBruta}" target="_blank" class="text-violet-600 font-bold underline">abrir resposta crua da planilha (aba ${TAB})</a>
      ${e.dump ? `<br><br><pre class="text-left whitespace-pre-wrap text-[10px] bg-gray-100 p-3 rounded-lg mt-2">${e.dump}</pre>` : ''}
    </div>`;
  }
}

carregar();
</script>
</body>
</html>
