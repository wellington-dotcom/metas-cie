<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="theme-color" content="#F3F4F6">
<title>Dashboard Mensal - Visão da Gestão</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'brand-purple': '#7C5DFA',
            'brand-orange': '#FF9F43',
            'brand-green': '#28C76F',
            'brand-red': '#FF4D4D',
            'bg-gray': '#F8F9FB',
          },
          borderRadius: {
            'xl': '1rem',
            '2xl': '1.5rem',
          }
        }
      }
    }
</script>
<style data-purpose="custom-gradients">
    body {
      background-color: #F3F4F6;
      background-image:
        radial-gradient(circle at 100% 0%, rgba(124, 93, 250, 0.4) 0%, transparent 40%),
        radial-gradient(circle at 0% 100%, rgba(124, 93, 250, 0.2) 0%, transparent 30%),
        radial-gradient(circle at 100% 100%, rgba(255, 159, 67, 0.2) 0%, transparent 40%);
      background-attachment: fixed;
      font-family: 'Inter', sans-serif;
    }
    .card-shadow {
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    }
    .nav-link { transition: background-color .15s, color .15s; }
</style>
</head>
<body class="min-h-screen p-8 md:p-12">
<div class="max-w-6xl mx-auto" id="app">
  <div class="text-center py-20 text-gray-500 font-medium">Carregando o mês…</div>
</div>

<script>
/* ============ CONFIG ============ */
const SHEET_ID = '1kFVP2oocRi0zsofaK9BihRbnpCo_nyM0R28wARnQu1A';
const TAB = '2_Dashboard_Mensal';

/* ============ HELPERS DE TEXTO ============ */
function norm(s){ return String(s??'').trim().toLowerCase(); }

/* ============ FETCH ============
   fetch() direto no gviz. Só funciona fora do preview de artifact do Claude
   (hospedado, ex: GitHub Pages). */
async function buscarAba(tab){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
  const res = await fetch(url);
  const raw = await res.text();
  const jsonText = raw.substring(raw.indexOf('{'), raw.lastIndexOf('}')+1);
  const data = JSON.parse(jsonText);
  if(data.status==='error') throw new Error(JSON.stringify(data.errors));
  return data.table;
}

/* ============ ACHAR COLUNA "PESSOA" ============
   O Google atribui UM tipo por coluna (baseado na maioria dos dados dela).
   Nas colunas de número (Meta mês, Realizado, Bônus apurado...) qualquer
   texto que caia ali (o próprio cabeçalho, ou texto solto tipo "jul./2026")
   é DESCARTADO — não aparece em lugar nenhum da resposta. Só sobrevivem
   como texto as colunas que são texto o tempo todo (Pessoa, Status,
   Mensagem). Por isso não dá pra confiar em ler o texto do cabeçalho das
   colunas numéricas — a solução é achar "Pessoa" e usar posição relativa a
   ela pra tudo o mais. */
function acharColPessoa(table){
  const rows = table.rows, C = table.cols.length;
  const val=(r,c)=>{const x=rows[r]&&rows[r].c[c];return x?(x.f??x.v??''):''};
  const colLabelsNorm = table.cols.map(c => norm(c.label));

  let colPessoa = colLabelsNorm.findIndex(l => l==='pessoa');
  if(colPessoa>=0) return {colPessoa, dataStartRow:0};

  const limite = Math.min(rows.length,40);
  for(let r=0;r<limite;r++){
    for(let c=0;c<C;c++){ if(norm(val(r,c))==='pessoa'){ return {colPessoa:c, dataStartRow:r+1}; } }
  }
  colPessoa = colLabelsNorm.findIndex(l => l.includes('pessoa'));
  if(colPessoa>=0) return {colPessoa, dataStartRow:0};
  for(let r=0;r<limite;r++){
    for(let c=0;c<C;c++){ if(norm(val(r,c)).includes('pessoa')){ return {colPessoa:c, dataStartRow:r+1}; } }
  }
  return null;
}

function montarDump(table){
  const rows = table.rows, C = table.cols.length;
  const val=(r,c)=>{const x=rows[r]&&rows[r].c[c];return x?(x.f??x.v??''):''};
  const dump = [];
  dump.push('--- table.cols (rótulos de coluna crus) ---');
  table.cols.forEach((c,i)=>{ dump.push(`col ${i}: id="${c.id}" label=${JSON.stringify(c.label)} type=${c.type}`); });
  dump.push('');
  dump.push('--- primeiras linhas de table.rows ---');
  for(let r=0;r<Math.min(rows.length,25);r++){
    const linha = [];
    for(let c=0;c<Math.min(C,14);c++) linha.push(val(r,c) || '·');
    dump.push(`L${r}: ${linha.join(' | ')}`);
  }
  return dump.join('\n');
}

/* ============ PARSER ESPECÍFICO DO DASHBOARD MENSAL ============
   Estrutura fixa da planilha: a partir da coluna "Pessoa", nessa ordem —
   Meta mês, Realizado, % atingido, Projeção, % projeção, Status, Bônus
   apurado, Faltas, Penalidade, A ser Pago, Bônus máximo, Mensagem. */
function parseMensal(table){
  const rows = table.rows;
  const cell=(r,c)=>(rows[r]&&rows[r].c[c])?rows[r].c[c]:null;
  const val=(r,c)=>{const x=cell(r,c);return x?(x.f??x.v??''):''};
  const rawnum=(r,c)=>{const x=cell(r,c);if(!x)return null;const n=typeof x.v==='number'?x.v:parseFloat(String(x.v).replace(',','.'));return isNaN(n)?null:n};

  const ancora = acharColPessoa(table);
  if(!ancora){
    const err = new Error('Cabeçalho "Pessoa" não encontrado nessa aba (nem nos títulos das colunas, nem no conteúdo)');
    err.dump = montarDump(table);
    throw err;
  }
  const {colPessoa, dataStartRow} = ancora;
  const colMeta=colPessoa+1, colReal=colPessoa+2, colPct=colPessoa+3, colProj=colPessoa+4,
        colPctProj=colPessoa+5, colStatus=colPessoa+6, colBonusApurado=colPessoa+7,
        colFaltas=colPessoa+8, colPenalidade=colPessoa+9, colASerPago=colPessoa+10,
        colBonusMax=colPessoa+11, colMsg=colPessoa+12;

  const pessoas = [];
  let totalASerPago = null;
  let linhaVisaoGeral = -1;
  for(let r=0;r<dataStartRow;r++){
    if(norm(val(r,colPessoa))==='mês'){ linhaVisaoGeral = r; break; }
  }
  for(let r=dataStartRow;r<rows.length;r++){
    const nome = val(r,colPessoa);
    if(nome===''||nome==null) break;
    if(norm(nome)==='total'){
      totalASerPago = val(r,colASerPago) || null;
      continue;
    }
    pessoas.push({
      nome,
      meta: val(r,colMeta), realizado: val(r,colReal),
      pct: val(r,colPct)||null, pctNum: rawnum(r,colPct),
      projecao: val(r,colProj), pctProjecao: val(r,colPctProj)||null,
      status: val(r,colStatus),
      bonusApurado: val(r,colBonusApurado)||null,
      faltas: rawnum(r,colFaltas),
      penalidade: val(r,colPenalidade)||null,
      aSerPago: val(r,colASerPago)||null,
      bonusMax: val(r,colBonusMax)||null,
      mensagem: val(r,colMsg)
    });
  }

  /* A tira "Visão Geral" usa as MESMAS colunas (por posição) que a tabela de
     pessoas, só que uma linha acima. "Mês" (texto "jul./2026") e alguns
     rótulos ficam perdidos pelo motivo explicado acima — por isso calculamos
     o mês direto no JS em vez de depender dessa célula. */
  const visaoGeral = {
    pctDecorrido: linhaVisaoGeral>=0 ? (val(linhaVisaoGeral,colPct)||null) : null,
    faturamentoMeta: linhaVisaoGeral>=0 ? (val(linhaVisaoGeral,colPctProj)||null) : null,
    bonusTotalPossivel: linhaVisaoGeral>=0 ? (val(linhaVisaoGeral,colBonusApurado)||null) : null,
    totalApurado: linhaVisaoGeral>=0 ? (val(linhaVisaoGeral,colBonusMax)||null) : null,
    totalASerPago
  };

  return {visaoGeral, pessoas};
}

function mesAtualExtenso(){
  const meses = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
  const d = new Date();
  return meses[d.getMonth()] + '/' + d.getFullYear();
}

/* ============ ESTILO por status (emoji -> cores/ícone consistentes) ============ */
function statusEstilo(status){
  if((status||'').includes('🟢')) return {dot:'bg-brand-green', barBg:'bg-green-50', barBorder:'border-green-100', barText:'text-brand-green', iconBg:'bg-brand-green', icon:'check'};
  if((status||'').includes('🔴')) return {dot:'bg-brand-red', barBg:'bg-red-50', barBorder:'border-red-100', barText:'text-brand-red', iconBg:'bg-brand-red', icon:'x'};
  return {dot:'bg-yellow-400', barBg:'bg-orange-50', barBorder:'border-orange-100', barText:'text-brand-orange', iconBg:'bg-brand-orange', icon:'warn'};
}
function iconSvg(tipo){
  if(tipo==='check') return `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>`;
  if(tipo==='x') return `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"></path></svg>`;
  return `<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 9v3.5m0 3.5h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path></svg>`;
}

/* ============ CARD DE PESSOA ============ */
function cardPessoa(p){
  const st = statusEstilo(p.status);
  return `
  <article class="bg-white rounded-3xl overflow-hidden card-shadow flex flex-col">
    <div class="p-8 pb-4">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">${p.nome}</h2>
        <div class="w-3 h-3 rounded-full ${st.dot}"></div>
      </div>
      <div class="grid grid-cols-3 gap-2 text-center mb-6">
        <div>
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter">Meta</p>
          <p class="font-bold text-gray-800">${p.meta ?? '—'}</p>
        </div>
        <div>
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter">Realizado</p>
          <p class="font-bold text-gray-800">${p.realizado ?? '—'}</p>
        </div>
        <div>
          <p class="text-[10px] font-bold text-gray-400 uppercase tracking-tighter">Projeção</p>
          <p class="font-bold text-gray-800">${p.projecao ?? '—'}</p>
        </div>
      </div>
      <div class="grid grid-cols-3 gap-3 mb-4">
        <div class="text-center">
          <span class="block bg-brand-purple text-white text-[10px] font-bold py-1 rounded-full mb-2 uppercase">Apurado</span>
          <div class="bg-purple-50 rounded-xl py-3 font-bold text-gray-800">${p.bonusApurado ?? '—'}</div>
        </div>
        <div class="text-center">
          <span class="block bg-brand-orange text-white text-[10px] font-bold py-1 rounded-full mb-2 uppercase">A Pagar</span>
          <div class="bg-orange-50 rounded-xl py-3 font-bold text-gray-800">${p.aSerPago || 'R$ 0'}</div>
        </div>
        <div class="text-center">
          <span class="block bg-brand-purple text-white text-[10px] font-bold py-1 rounded-full mb-2 uppercase">Máximo</span>
          <div class="bg-purple-50 rounded-xl py-3 font-bold text-gray-800">${p.bonusMax ?? '—'}</div>
        </div>
      </div>
      ${p.faltas ? `<div class="text-xs font-bold text-brand-red bg-red-50 rounded-lg py-2 px-3 text-center mb-2">⚠️ ${p.faltas} falta(s) no mês — desconto de ${p.penalidade||'—'}</div>` : ''}
    </div>
    <div class="${st.barBg} p-4 flex items-center gap-3 border-t ${st.barBorder} mt-auto">
      <div class="${st.iconBg} p-1 rounded-full text-white">${iconSvg(st.icon)}</div>
      <p class="${st.barText} font-bold text-sm">${p.mensagem || ''}</p>
    </div>
  </article>`;
}

/* ============ RENDER ============ */
function render(dados){
  const {visaoGeral, pessoas} = dados;
  const app = document.getElementById('app');
  app.innerHTML = `
    <nav class="mb-12">
      <div class="inline-flex items-center bg-white/80 backdrop-blur-sm p-1 rounded-full shadow-sm border border-gray-100">
        <a href="metas-index.html" class="nav-link px-6 py-2 rounded-full text-sm font-medium text-gray-600 hover:bg-gray-50">Individual</a>
        <a href="dashboard-mensal.html" class="nav-link px-6 py-2 rounded-full text-sm font-medium text-white bg-brand-purple shadow-md">Mensal</a>
        <a href="dashboard-semanal.html" class="nav-link px-6 py-2 rounded-full text-sm font-medium text-gray-600 hover:bg-gray-50">Semanal</a>
      </div>
    </nav>

    <header class="mb-10">
      <span class="text-xs font-bold tracking-widest text-gray-900 uppercase">Visão da Gestão</span>
      <h1 class="text-4xl font-extrabold text-gray-900 mt-1">Dashboard Mensal</h1>
      <p class="text-gray-500 mt-2 font-medium">Referente a ${mesAtualExtenso()}${visaoGeral.pctDecorrido ? ' · ' + visaoGeral.pctDecorrido + ' do mês decorrido' : ''}</p>
    </header>

    <main>
      <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-10">
        <div class="bg-white rounded-3xl p-6 flex flex-col justify-between border-l-[10px] border-brand-purple card-shadow h-36">
          <span class="text-gray-700 font-semibold text-lg">Faturamento Meta</span>
          <span class="text-4xl font-bold text-gray-800">${visaoGeral.faturamentoMeta ?? '—'}</span>
        </div>
        <div class="bg-white rounded-3xl p-6 flex flex-col justify-between border-l-[10px] border-brand-orange card-shadow h-36">
          <span class="text-gray-700 font-semibold text-lg">Bônus Total Possível</span>
          <span class="text-4xl font-bold text-gray-800">${visaoGeral.bonusTotalPossivel ?? '—'}</span>
        </div>
        <div class="bg-white rounded-3xl p-6 flex flex-col justify-between border-l-[10px] border-brand-purple card-shadow h-36">
          <span class="text-gray-700 font-semibold text-lg">Total Apurado</span>
          <span class="text-4xl font-bold text-gray-800">${visaoGeral.totalApurado ?? '—'}</span>
        </div>
        <div class="bg-white rounded-3xl p-6 flex flex-col justify-between border-l-[10px] border-brand-orange card-shadow h-36">
          <span class="text-gray-700 font-semibold text-lg">Total a Pagar</span>
          <span class="text-4xl font-bold text-gray-800">${visaoGeral.totalASerPago ?? '—'}</span>
        </div>
      </section>

      <section class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
        ${pessoas.map(cardPessoa).join('')}
      </section>
    </main>

    <footer class="mt-16 pb-8">
      <p class="text-gray-600 text-sm font-medium">Dados direto da planilha · "A pagar" já considera o desconto de faltas (se houver)</p>
    </footer>
  `;
}

/* ============ CARREGAR ============ */
async function carregar(){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="text-center py-20 text-gray-500 font-medium">Carregando o mês…</div>';
  try{
    const table = await buscarAba(TAB);
    const dados = parseMensal(table);
    render(dados);
  }catch(e){
    const dentroDeIframe = (function(){ try{ return window.self !== window.top; }catch(_){ return true; } })();
    const dicaSandbox = dentroDeIframe
      ? `<p class="mt-3 text-sm text-gray-600"><b>Isso é esperado dentro do preview do Claude:</b> por segurança, o Claude bloqueia chamadas de rede externas de dentro do artifact. Essa tela só vai puxar dados de verdade fora daqui — publicada (ex: GitHub Pages).</p>`
      : '';
    const urlBruta = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(TAB)}`;
    app.innerHTML = `
      <div class="bg-white rounded-3xl p-10 text-center card-shadow">
        <p class="text-brand-red font-bold text-lg">Não consegui ler o Dashboard Mensal.</p>
        <p class="mt-3 text-gray-600">${e.message}</p>
        ${dicaSandbox}
        <p class="mt-4"><a href="${urlBruta}" target="_blank" class="text-brand-purple font-bold underline">abrir resposta crua da planilha (aba ${TAB})</a></p>
        ${e.dump ? `<pre class="mt-4 text-left text-[10px] bg-gray-50 rounded-xl p-4 overflow-auto whitespace-pre-wrap">${e.dump}</pre>` : ''}
      </div>`;
  }
}

carregar();
</script>
</body>
</html>
