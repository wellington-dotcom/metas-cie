<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<meta name="theme-color" content="#f3f4f9">
<title>Dashboard de Metas e Bônus</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>
  body{font-family:'Inter',sans-serif;background-color:#f3f4f9;
    background-image:
      radial-gradient(circle at 10% 20%, rgba(138,58,255,.10) 0%, transparent 20%),
      radial-gradient(circle at 90% 80%, rgba(255,126,0,.10) 0%, transparent 20%),
      radial-gradient(circle at 50% 50%, rgba(138,58,255,.05) 0%, transparent 40%);
    min-height:100vh; overflow-x:hidden}
  .bg-shape{position:fixed;z-index:-1;filter:blur(40px);opacity:.4}
  .soft-card{background:rgba(255,255,255,.9);border-radius:24px;
    box-shadow:0 10px 25px -5px rgba(0,0,0,.05),0 8px 10px -6px rgba(0,0,0,.05);
    border:1px solid rgba(255,255,255,.8)}
  .progress-ring-circle{transition:stroke-dashoffset .8s cubic-bezier(.16,1,.3,1);
    transform:rotate(-90deg);transform-origin:50% 50%}
  .no-scrollbar::-webkit-scrollbar{display:none}
  .week-locked{filter:grayscale(.15)}
  select.pessoa-select{font-family:'Inter',sans-serif}
</style>
</head>
<body class="p-4 md:p-8">
<div class="bg-shape top-10 left-[-5%] w-64 h-64 bg-purple-400 rounded-full"></div>
<div class="bg-shape bottom-20 right-[-5%] w-80 h-80 bg-orange-400 rounded-full"></div>

<div class="max-w-6xl mx-auto space-y-6" id="app">
  <div class="soft-card p-10 text-center text-gray-500">Carregando seus números…</div>
</div>

<script>
/* ================= CONFIG + PARSER + FETCH (testados, sem alteração) ================= */
const SHEET_ID = '1kFVP2oocRi0zsofaK9BihRbnpCo_nyM0R28wARnQu1A';
const ABAS = [
  {tab:'5_SDR', nome:'Rayana'},
  {tab:'4_Marketing', nome:'Gabrielly'},
  {tab:'6_Closer', nome:'Isadora'},
  {tab:'7_Recepção', nome:'Ludimila'},
  {tab:'8_Auxiliar', nome:'Nauane'},
  {tab:'09_Suporte', nome:'Tereza'},
  {tab:'9_Haniely', nome:'Haniely'},
];

function norm(s){ return String(s??'').trim().toLowerCase(); }
function parseAbaIndividual(table){
  const rows = table.rows, C = table.cols.length;
  const cell=(r,c)=>(rows[r]&&rows[r].c[c])?rows[r].c[c]:null;
  const val=(r,c)=>{const x=cell(r,c);return x?(x.f??x.v??''):''};
  const rawnum=(r,c)=>{const x=cell(r,c);if(!x)return null;const n=typeof x.v==='number'?x.v:parseFloat(String(x.v).replace(',','.'));return isNaN(n)?null:n};
  let headerRow=-1,colDia=-1;
  const limiteBusca = Math.min(rows.length,30);
  for(let r=0;r<limiteBusca;r++){for(let c=0;c<C;c++){if(norm(val(r,c))==='dia'){headerRow=r;colDia=c;break}}if(headerRow>=0)break}
  if(headerRow<0){
    const dump = [];
    for(let r=0;r<Math.min(rows.length,20);r++){
      const linha = [];
      for(let c=0;c<Math.min(C,10);c++) linha.push(val(r,c) || '·');
      dump.push(`L${r}: ${linha.join(' | ')}`);
    }
    const err = new Error('Cabeçalho "Dia" não encontrado nessa aba');
    err.dump = dump.join('\n');
    throw err;
  }
  const headerMap={};
  for(let c=colDia;c<C;c++){const t=norm(val(headerRow,c));if(t)headerMap[t]=c}
  const colData=headerMap['data'], colFaltou=headerMap['faltou?'], colMetaDia=headerMap['meta dia'],
        colAcum=headerMap['acum. semana'], colSemana=headerMap['semana'];
  const colMetrica = colAcum!=null ? colAcum-1 : null;
  const dias=[];
  for(let r=headerRow+1;r<rows.length;r++){
    const dv=val(r,colDia); if(dv===''||dv==null) break;
    dias.push({dia:rawnum(r,colDia),data:val(r,colData),semana:colSemana!=null?rawnum(r,colSemana):null,
      realizado:colMetrica!=null?rawnum(r,colMetrica):null,acumSemana:colAcum!=null?rawnum(r,colAcum):null,
      faltou:colFaltou!=null?(norm(val(r,colFaltou))==='sim'||norm(val(r,colFaltou))==='x'):false,
      metaDia:colMetaDia!=null?rawnum(r,colMetaDia):null});
  }
  let resumoRow=-1,resumoCol=-1;
  for(let r=0;r<rows.length;r++){for(let c=0;c<C;c++){if(norm(val(r,c)).includes('resumo do mês')){resumoRow=r;resumoCol=c;break}}if(resumoRow>=0)break}
  if(resumoRow<0) throw new Error('Bloco "RESUMO DO MÊS" não encontrado nessa aba');
  const resumo={semanas:{}}; let mensagem='';
  for(let r=resumoRow+1;r<rows.length;r++){
    const label=norm(val(r,resumoCol)); const valor=val(r,resumoCol+1); const valor2=val(r,resumoCol+2);
    if(!label) continue;
    if(label==='meta mensal') resumo.metaMensal=rawnum(r,resumoCol+1);
    else if(label==='realizado (até hoje)') resumo.realizadoAteHoje=rawnum(r,resumoCol+1);
    else if(label==='realizado total no mês') resumo.realizadoTotal=rawnum(r,resumoCol+1);
    else if(label==='% atingido') resumo.pctAtingido=valor;
    else if(label==='projeção do mês (no ritmo)') resumo.projecao=rawnum(r,resumoCol+1);
    else if(label==='projeção / meta') resumo.pctProjecao=valor;
    else if(label==='total de faltas no mês') resumo.faltas=rawnum(r,resumoCol+1);
    else if(label==='desconto sobre o total') resumo.desconto=valor;
    else if(/^semana [1-5]$/.test(label)){ const n=label.split(' ')[1]; resumo.semanas[n]={bonus:valor,realMeta:valor2} }
    else if(label.includes('subtotal base')) resumo.bonusBase=valor;
    else if(label.includes('bônus extra')) resumo.bonusExtra=valor;
    else if(label.includes('total possível')) resumo.bonusTotal=valor;
    else if(!valor && label.length>15 && !mensagem) mensagem=val(r,resumoCol);
  }
  resumo.mensagem=mensagem;
  return {dias,resumo};
}
async function buscarAba(tab){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
  const res = await fetch(url);
  const raw = await res.text();
  const jsonText = raw.substring(raw.indexOf('{'), raw.lastIndexOf('}')+1);
  const data = JSON.parse(jsonText);
  if(data.status==='error') throw new Error(JSON.stringify(data.errors));
  return data.table;
}
function statusDe(mensagem){
  if((mensagem||'').includes('🟢')) return {cor:'emerald', hex:'#10b981', bg:'#d1fae5', ink:'#047857'};
  if((mensagem||'').includes('🔴')) return {cor:'red', hex:'#ef4444', bg:'#fee2e2', ink:'#b91c1c'};
  return {cor:'amber', hex:'#f59e0b', bg:'#fef3c7', ink:'#b45309'};
}
function saudacao(){
  const h = new Date().getHours();
  if(h<12) return 'Bom dia';
  if(h<18) return 'Boa tarde';
  return 'Boa noite';
}

/* ================= HELPERS NOVOS (visual Stitch) ================= */
function parseDataBR(s){
  if(!s) return null;
  const [d,m,y] = String(s).split('/').map(Number);
  if(!d||!m) return null;
  const ano = y ? (y<100?2000+y:y) : new Date().getFullYear();
  return new Date(ano, m-1, d);
}
function diasNoMes(date){ return new Date(date.getFullYear(), date.getMonth()+1, 0).getDate(); }

function svgRing(pct, corHex, size=64, stroke=6){
  const r = (size/2)-stroke;
  const C = 2*Math.PI*r;
  const off = C - Math.max(0,Math.min(pct,1))*C;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="transparent" stroke="#e5e7eb" stroke-width="${stroke}"/>
    <circle class="progress-ring-circle" cx="${size/2}" cy="${size/2}" r="${r}" fill="transparent"
      stroke="${corHex}" stroke-width="${stroke}" stroke-linecap="round"
      stroke-dasharray="${C}" stroke-dashoffset="${off}"/>
  </svg>`;
}

const ICONE_CHECK = `<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round" stroke-width="3"/></svg>`;
const ICONE_ANDAMENTO = `<svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M13.492 10.39c-1.381 0-2.5 1.119-2.5 2.5s1.119 2.5 2.5 2.5 2.5-1.119 2.5-2.5-1.119-2.5-2.5-2.5zm.008 4c-.827 0-1.5-.673-1.5-1.5s.673-1.5 1.5-1.5 1.5.673 1.5 1.5-.673 1.5-1.5 1.5z"/><path d="M19.03 12c0-3.059-2.471-5.53-5.53-5.53s-5.53 2.471-5.53 5.53c0 1.488.587 2.84 1.543 3.844l-1.493 1.493C6.772 16.035 6 14.108 6 12c0-4.411 3.589-8 8-8s8 3.589 8 8c0 2.108-.772 4.035-2.02 5.337l-1.493-1.493c.956-1.004 1.543-2.356 1.543-3.844z"/></svg>`;
const ICONE_CADEADO = `<svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" clip-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z"/></svg>`;

const CORES_SEMANA_UNLOCKED = ['bg-violet-600','bg-emerald-500'];

/* ================= RENDER ================= */
function render(pessoa, parsed){
  const {dias, resumo} = parsed;
  const st = statusDe(resumo.mensagem);
  const pctNum = resumo.metaMensal ? resumo.realizadoTotal/resumo.metaMensal : 0;
  const pctLabel = resumo.pctAtingido || Math.round(pctNum*100)+'%';

  const hoje = dias[dias.length-1];
  const hojeData = hoje ? parseDataBR(hoje.data) : null;
  const totalDiasMes = hojeData ? diasNoMes(hojeData) : null;
  const diasRestantes = (hoje && totalDiasMes) ? Math.max(0, totalDiasMes - hoje.dia) : null;
  const pctMesDecorrido = (hoje && totalDiasMes) ? hoje.dia/totalDiasMes : 0;

  const semanaAtualNum = hoje ? hoje.semana : null;

  // Jornada do bônus: status de cada semana (concluída / em andamento / travada)
  const semanasOrdenadas = ['1','2','3','4','5'].filter(n=>resumo.semanas[n]);
  const jornadaHtml = semanasOrdenadas.map((n,i)=>{
    const s = resumo.semanas[n];
    const numSemana = parseInt(n,10);
    const concluida = semanaAtualNum!=null && numSemana < semanaAtualNum;
    const emAndamento = semanaAtualNum!=null && numSemana === semanaAtualNum;
    if(concluida){
      const cor = CORES_SEMANA_UNLOCKED[i % CORES_SEMANA_UNLOCKED.length];
      return `<div class="relative z-10 flex flex-col items-center w-1/5 px-1">
        <div class="${cor} rounded-2xl p-4 text-white text-center w-full shadow-lg mb-4">
          <p class="text-xs opacity-90 font-semibold">Semana ${n}</p>
          <p class="text-[10px] opacity-75 mb-2">Concluída</p>
          <div class="bg-white/90 rounded-full w-8 h-8 flex items-center justify-center mx-auto mb-3" style="color:inherit">
            <span class="${cor.replace('bg-','text-')}">${ICONE_CHECK}</span>
          </div>
          <p class="text-xl font-bold">${s.bonus}</p>
          <hr class="border-white/30 my-2"/>
          <p class="text-[10px] font-medium">${s.realMeta||'—'} Meta</p>
        </div>
      </div>`;
    }
    if(emAndamento){
      return `<div class="relative z-10 flex flex-col items-center w-1/5 px-1">
        <div class="bg-amber-100 border-2 border-amber-400 rounded-2xl p-4 text-amber-700 text-center w-full shadow-xl mb-4 scale-105">
          <p class="text-xs font-bold">Semana ${n}</p>
          <p class="text-[10px] opacity-75 mb-2">Em andamento</p>
          <div class="bg-amber-400 text-white rounded-full w-8 h-8 flex items-center justify-center mx-auto mb-3">${ICONE_ANDAMENTO}</div>
          <p class="text-xl font-black text-gray-900">${s.bonus}</p>
          <hr class="border-amber-300 my-2"/>
          <p class="text-[10px] font-bold">${s.realMeta||'—'} Meta</p>
        </div>
      </div>`;
    }
    return `<div class="relative z-10 flex flex-col items-center w-1/5 px-1 week-locked">
      <div class="bg-gray-200 rounded-2xl p-4 text-gray-500 text-center w-full mb-4">
        <p class="text-xs font-semibold">Semana ${n}</p>
        <p class="text-[10px] opacity-75 mb-2">A vir</p>
        <div class="bg-gray-400 text-white rounded-full w-8 h-8 flex items-center justify-center mx-auto mb-3">${ICONE_CADEADO}</div>
        <p class="text-xl font-bold text-gray-700">${s.bonus}</p>
        <hr class="border-gray-300 my-2"/>
        <p class="text-[10px]">alvo da semana</p>
      </div>
    </div>`;
  }).join('');

  // gráfico diário: barra por dia, cor por status daquele dia, linha pontilhada = meta do dia mais recente
  const metaRef = hoje ? (hoje.metaDia||0) : 0;
  const maxVal = Math.max(metaRef, ...dias.map(d=>d.realizado||0), 1);
  const alturaPx = 220;
  const metaLinhaPct = maxVal ? (metaRef/maxVal)*100 : 0;
  const barrasHtml = dias.map(d=>{
    const h = maxVal ? Math.max(2, Math.round(((d.realizado||0)/maxVal)*alturaPx)) : 2;
    const isHoje = d===hoje;
    let cor = 'bg-gray-200';
    if(isHoje) cor='bg-violet-600';
    else if(d.metaDia!=null){ cor = (d.realizado||0) >= d.metaDia ? 'bg-emerald-500' : 'bg-orange-400'; }
    return `<div class="flex-1 flex flex-col items-center group min-w-[10px]">
      <div class="w-2 md:w-3 ${cor} rounded-t-sm" style="height:${h}px" title="Dia ${d.dia}: ${d.realizado ?? 0}"></div>
      <span class="mt-2 text-[9px] font-bold text-gray-400">${d.dia}</span>
    </div>`;
  }).join('');

  const app = document.getElementById('app');
  app.innerHTML = `
    <header class="rounded-xl shadow-lg mb-2 flex items-center justify-between px-4 py-3"
      style="background:linear-gradient(90deg,#8a3aff 0%,#ff7e00 100%)">
      <div>
        <p class="text-white/80 text-xs font-semibold uppercase tracking-wide">${saudacao()}</p>
        <p class="text-white text-lg font-extrabold leading-tight">${pessoa.nome}</p>
      </div>
      <select id="seletor" class="pessoa-select rounded-lg border-0 text-xs font-bold px-3 py-2 bg-white/90 text-gray-700">
        ${ABAS.map(a=>`<option value="${a.tab}" ${a.tab===pessoa.tab?'selected':''}>${a.nome}</option>`).join('')}
      </select>
    </header>

    <nav class="flex gap-2 flex-wrap px-1">
      <a href="index.html" class="text-xs font-bold px-3 py-2 rounded-full bg-violet-600 text-white">Individual</a>
      <a href="dashboard-mensal.html" class="text-xs font-bold px-3 py-2 rounded-full bg-gray-100 text-gray-600 hover:bg-violet-50">Mensal</a>
      <a href="dashboard-semanal.html" class="text-xs font-bold px-3 py-2 rounded-full bg-gray-100 text-gray-600 hover:bg-violet-50">Semanal</a>
    </nav>

    ${resumo.mensagem ? `<div class="soft-card px-5 py-3 text-sm font-semibold" style="color:${st.ink};background:${st.bg}">${resumo.mensagem}</div>` : ''}

    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      <div class="soft-card p-6 flex justify-between items-center">
        <div>
          <h3 class="text-gray-700 font-bold text-lg mb-2">Meta Atual</h3>
          <p class="text-2xl font-black text-gray-900">${resumo.realizadoTotal ?? '—'}<span class="text-sm font-semibold text-gray-400"> / ${resumo.metaMensal ?? '—'}</span></p>
        </div>
        <div class="relative flex items-center justify-center">
          ${svgRing(pctNum, st.hex, 64, 6)}
          <span class="absolute text-sm font-bold text-gray-800">${pctLabel}</span>
        </div>
      </div>
      <div class="soft-card p-6 flex flex-col items-center justify-center text-center">
        <h3 class="text-gray-700 font-bold text-lg">Bônus Acumulado</h3>
        <p class="text-3xl font-extrabold text-gray-900 mt-1">${resumo.bonusBase ?? '—'}</p>
      </div>
      <div class="soft-card p-6 flex flex-col items-center justify-center">
        <h3 class="text-gray-700 font-bold text-lg mb-1">Dias Restantes</h3>
        <p class="text-2xl font-black text-violet-600 mb-3">${diasRestantes ?? '—'}</p>
        <div class="w-full h-3 bg-gray-100 rounded-full relative">
          <div class="absolute left-0 top-0 h-full bg-purple-500 rounded-full" style="width:${Math.round(pctMesDecorrido*100)}%"></div>
          <div class="absolute top-1/2 -translate-y-1/2 w-4 h-4 bg-purple-700 border-2 border-white rounded-full" style="left:calc(${Math.round(pctMesDecorrido*100)}% - 8px)"></div>
        </div>
      </div>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
      <div class="lg:col-span-1 soft-card p-8 flex flex-col items-center justify-center text-center">
        <div class="mb-6"><span class="material-symbols-outlined text-5xl text-amber-400" style="font-size:48px">emoji_events</span></div>
        <h3 class="text-xl font-bold text-gray-800 leading-tight">Bônus EXTRA</h3>
        <p class="text-gray-500 text-sm mb-4">(se bater a meta do mês)</p>
        <p class="text-4xl font-black text-gray-900">${resumo.bonusExtra ?? '—'}</p>
      </div>
      <div class="lg:col-span-3 soft-card p-8">
        <h2 class="text-center text-2xl font-bold text-gray-800 mb-10">Jornada do Bônus Mensal</h2>
        <div class="relative flex justify-between items-start">
          <div class="absolute top-20 left-0 w-full h-1 bg-gray-200 -z-0"></div>
          ${jornadaHtml}
        </div>
      </div>
    </div>

    <div class="soft-card p-8">
      <h2 class="text-center text-2xl font-bold text-gray-800 mb-8">Acompanhamento Diário</h2>
      <div class="relative w-full overflow-x-auto no-scrollbar">
        <div class="ml-2 min-w-[600px]">
          <div class="relative border-b border-gray-200 flex items-end justify-between px-2 pb-2" style="height:${alturaPx+20}px">
            <div class="absolute w-full border-t-2 border-dotted border-gray-800 z-20" style="bottom:${metaLinhaPct}%"></div>
            <div class="absolute right-0 -translate-y-4 text-[10px] font-bold text-gray-800 bg-white/80 px-1" style="bottom:${metaLinhaPct}%">Meta Diária (${metaRef})</div>
            ${barrasHtml}
          </div>
          <div class="text-center mt-3 text-[11px] font-bold text-gray-500 uppercase tracking-widest">Dias do mês</div>
        </div>
      </div>
    </div>

    <div class="text-center text-xs text-gray-400 pb-4">Dados direto da planilha · pode levar alguns minutos pra atualizar</div>
  `;

  document.getElementById('seletor').addEventListener('change', e=>{
    localStorage.setItem('metas_pessoa', e.target.value);
    carregar(e.target.value);
  });
}

/* ================= CARREGAR ================= */
async function carregar(tab){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="soft-card p-10 text-center text-gray-500">Carregando seus números…</div>';
  const pessoa = ABAS.find(a=>a.tab===tab) || ABAS[0];
  try{
    const table = await buscarAba(pessoa.tab);
    const parsed = parseAbaIndividual(table);
    render(pessoa, parsed);
  }catch(e){
    const urlBruta = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(pessoa.tab)}`;
    app.innerHTML = `<div class="soft-card p-8 text-red-600">
      Não consegui ler essa aba.<br><br>${e.message}<br><br>
      <a href="${urlBruta}" target="_blank" class="text-violet-600 font-bold underline">abrir resposta crua da planilha</a>
      ${e.dump ? `<br><br><pre class="text-left whitespace-pre-wrap text-[10px] bg-gray-100 p-3 rounded-lg mt-2">${e.dump}</pre>` : ''}
    </div>`;
  }
}

carregar(localStorage.getItem('metas_pessoa') || '5_SDR');
</script>
</body>
</html>
