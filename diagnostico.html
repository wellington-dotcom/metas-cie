<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico — Planilha de Metas</title>
<style>
body{font-family:-apple-system,sans-serif;background:#0A0A0A;color:#F2F2F7;padding:16px;max-width:900px;margin:0 auto}
h1{font-size:20px}
.row{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
select,button{padding:10px 14px;border-radius:10px;border:none;font-size:15px}
select{background:#1C1C1E;color:#fff;flex:1;min-width:180px}
button{background:#C8FF3E;font-weight:700;cursor:pointer}
#status{font-size:13px;color:#9a9;margin:8px 0}
#urlShow{font-size:11px;color:#888;word-break:break-all;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
td,th{border:1px solid #333;padding:4px 6px;text-align:left;white-space:nowrap}
th{background:#1C1C1E;position:sticky;top:0}
.err{color:#ff6b6b;white-space:pre-wrap;font-size:13px}
.wrap{overflow-x:auto}
</style>
</head>
<body>
<h1>🔎 Diagnóstico da planilha de metas</h1>
<div class="row">
  <select id="aba">
    <option value="1_Configuração">1_Configuração</option>
    <option value="2_Dashboard_Mensal">2_Dashboard_Mensal</option>
    <option value="3_Dashboard_Semanal">3_Dashboard_Semanal</option>
    <option value="4_Marketing">4_Marketing</option>
    <option value="5_SDR" selected>5_SDR</option>
    <option value="6_Closer">6_Closer</option>
    <option value="7_Recepção">7_Recepção</option>
    <option value="8_Auxiliar">8_Auxiliar</option>
    <option value="9_Haniely">9_Haniely</option>
    <option value="09_Suporte">09_Suporte</option>
    <option value="10_Provisão_Anual">10_Provisão_Anual</option>
  </select>
  <button id="buscar">Buscar aba</button>
</div>
<div id="status">Escolha uma aba e toque em Buscar.</div>
<div id="urlShow"></div>
<div class="wrap"><div id="out"></div></div>

<script>
const SHEET_ID = '1kFVP2oocRi0zsofaK9BihRbnpCo_nyM0R28wARnQu1A';

function urlPara(aba){
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(aba)}`;
}

async function buscar(){
  const aba = document.getElementById('aba').value;
  const url = urlPara(aba);
  document.getElementById('urlShow').textContent = url;
  const status = document.getElementById('status');
  const out = document.getElementById('out');
  status.textContent = 'Buscando...';
  out.innerHTML = '';
  try{
    const res = await fetch(url);
    const raw = await res.text();
    // remove o prefixo/sufixo do callback do Google
    const jsonText = raw.substring(raw.indexOf('{'), raw.lastIndexOf('}')+1);
    const data = JSON.parse(jsonText);
    if(data.status === 'error'){
      status.innerHTML = `<span class="err">Erro retornado pelo Google: ${JSON.stringify(data.errors)}</span>`;
      return;
    }
    const cols = data.table.cols.map(c=>c.label || c.id || '');
    const rows = data.table.rows;
    status.textContent = `✅ OK — ${rows.length} linhas, ${cols.length} colunas encontradas na aba "${aba}".`;
    let html = '<table><tr>' + cols.map((c,i)=>`<th>col ${i} — ${c||'(sem título)'}</th>`).join('') + '</tr>';
    rows.forEach(r=>{
      html += '<tr>' + r.c.map(cell=>{
        const val = cell ? (cell.f ?? cell.v ?? '') : '';
        return `<td>${String(val).replace(/</g,'&lt;')}</td>`;
      }).join('') + '</tr>';
    });
    html += '</table>';
    out.innerHTML = html;
  }catch(e){
    status.innerHTML = `<span class="err">Falhou: ${e.message}\n\nCausas mais prováveis:\n1) A planilha ainda não está compartilhada como "Qualquer pessoa com o link → Leitor"\n2) O nome da aba está diferente do que eu tentei (confere acentos/maiúsculas)\n3) Bloqueio de rede</span>`;
  }
}
document.getElementById('buscar').addEventListener('click', buscar);
buscar();
</script>
</body>
</html>
