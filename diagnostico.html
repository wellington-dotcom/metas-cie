<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FBF9F4">
<title>Metas — Clínica Isabella Eleutério</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<style>
:root{
  --paper:#FBF9F4; --card:#FFFFFF; --line:rgba(33,31,54,.10); --fill:rgba(33,31,54,.05);
  --ink:#211F36; --ink2:rgba(33,31,54,.62); --ink3:rgba(33,31,54,.34);
  --violet:#5B4FE0; --violet-deep:#4038B0; --violet-bg:#EEEBFC;
  --gold:#B8862E; --gold-bg:#FBF0DA;
  --mint:#1FAE7C; --mint-bg:#E4F6EE;
  --amber:#F0932B; --amber-bg:#FDEEDC;
  --coral:#E2483A; --coral-bg:#FBE7E5;
  --df: 'Fraunces', Georgia, serif; --sf: 'Manrope', -apple-system, sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--sf);background:var(--paper);color:var(--ink);min-height:100vh;
  padding:calc(env(safe-area-inset-top) + 18px) 0 60px}
.wrap{max-width:520px;margin:0 auto;padding:0 18px}

.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
select{font-family:var(--sf);font-size:13px;font-weight:700;color:var(--ink2);background:var(--fill);
  border:none;border-radius:999px;padding:9px 14px}

.greeting{font-size:13px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.6px}
.nome{font-family:var(--df);font-size:34px;font-weight:600;line-height:1.05;margin:2px 0 22px;letter-spacing:-.5px}

/* ---- anel de progresso (elemento de assinatura) ---- */
.ringcard{background:var(--card);border-radius:28px;padding:28px 20px;display:flex;flex-direction:column;
  align-items:center;box-shadow:0 1px 2px rgba(33,31,54,.04),0 12px 32px rgba(33,31,54,.06);border:1px solid var(--line)}
.ringwrap{position:relative;width:216px;height:216px}
.ringwrap svg{transform:rotate(-90deg);width:216px;height:216px}
.ring-bg{fill:none;stroke:var(--fill);stroke-width:16}
.ring-fg{fill:none;stroke-width:16;stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.16,1,.3,1),stroke .4s}
.ringcenter{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ringcenter .num{font-family:var(--df);font-size:40px;font-weight:600;line-height:1}
.ringcenter .den{font-size:14px;color:var(--ink2);font-weight:600;margin-top:2px}
.ringcenter .pct{font-family:var(--sf);font-size:15px;font-weight:800;margin-top:8px;padding:4px 12px;border-radius:999px}
.label-meta{font-size:13px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.8px;margin-top:16px}
.msg{font-size:14.5px;font-weight:600;text-align:center;margin-top:10px;line-height:1.4;padding:0 8px}

/* ---- seções ---- */
.section{font-family:var(--sf);font-size:12.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;
  color:var(--ink3);margin:28px 4px 10px}
.card{background:var(--card);border-radius:22px;border:1px solid var(--line);box-shadow:0 1px 2px rgba(33,31,54,.03)}
.pad{padding:20px}

/* ---- missão do dia ---- */
.missao{display:flex;align-items:center;gap:14px}
.missao .check{width:44px;height:44px;border-radius:50%;background:var(--violet-bg);color:var(--violet);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:20px;transition:all .3s}
.missao.done .check{background:var(--mint);color:#fff}
.missao .txt b{font-family:var(--df);font-weight:600;font-size:17px}
.missao .txt div{font-size:13.5px;color:var(--ink2);margin-top:2px}

/* ---- bônus ---- */
.bonusgrid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line)}
.bonusgrid .cel{background:var(--card);padding:18px;text-align:center}
.bonusgrid .cel:first-child{border-radius:22px 0 0 0}
.bonusgrid .cel:nth-child(2){border-radius:0 22px 0 0}
.bonusgrid .cel:nth-child(3){border-radius:0 0 0 22px}
.bonusgrid .cel:last-child{border-radius:0 0 22px 0;grid-column:span 2;background:var(--gold-bg)}
.bonusgrid .lbl{font-size:11.5px;font-weight:700;color:var(--ink3);text-transform:uppercase;letter-spacing:.4px}
.bonusgrid .v{font-family:var(--df);font-size:22px;font-weight:600;margin-top:6px;color:var(--gold)}
.bonusgrid .cel:last-child .v{font-size:26px}

/* ---- semana (quadrados estilo github) ---- */
.semana{display:flex;gap:8px;justify-content:space-between;padding:18px}
.diasq{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px}
.diasq .sq{width:100%;aspect-ratio:1;border-radius:9px;background:var(--fill)}
.diasq .sq.cinza{background:var(--fill)}
.diasq .sq.azul{background:var(--violet)}
.diasq .sq.verde{background:var(--mint)}
.diasq .sq.vermelho{background:var(--coral)}
.diasq .dn{font-size:10.5px;font-weight:700;color:var(--ink3)}

/* ---- semanas tabela ---- */
.semrow{display:flex;align-items:center;justify-content:space-between;padding:13px 18px;border-bottom:1px solid var(--line)}
.semrow:last-child{border-bottom:none}
.semrow .nm{font-weight:700;font-size:14.5px}
.semrow .pc{font-size:13px;color:var(--ink2);font-weight:600}
.semrow .bn{font-family:var(--df);font-weight:600;color:var(--gold);font-size:15px}

.chartbox{padding:18px 14px 8px}
.footer{text-align:center;font-size:11.5px;color:var(--ink3);margin-top:26px}
.loading,.errbox{text-align:center;padding:60px 20px;color:var(--ink2);font-size:15px;line-height:1.6}
.errbox{color:var(--coral)}
</style>
</head>
<body>
<div class="wrap" id="app">
  <div class="loading">Carregando seus números…</div>
</div>

<script>
/* ============ CONFIG ============ */
const SHEET_ID = '1kFVP2oocRi0zsofaK9BihRbnpCo_nyM0R28wARnQu1A';
const ABAS = [
  {tab:'5_SDR', nome:'Rayana'},
  {tab:'4_Marketing', nome:'Gabrielly'},
  {tab:'6_Closer', nome:'Isadora'},
  {tab:'7_Recepção', nome:'Ludimila'},
  {tab:'8_Auxiliar', nome:'Nauane'},
  {tab:'09_Suporte', nome:'Tereza'},
  {tab:'9_Haniely', nome:'Haniely'},
];

/* ============ PARSER (mesma lógica testada em Node) ============ */
function norm(s){ return String(s??'').trim().toLowerCase(); }
function parseAbaIndividual(table){
  const rows = table.rows, C = table.cols.length;
  const cell=(r,c)=>(rows[r]&&rows[r].c[c])?rows[r].c[c]:null;
  const val=(r,c)=>{const x=cell(r,c);return x?(x.f??x.v??''):''};
  const rawnum=(r,c)=>{const x=cell(r,c);if(!x)return null;const n=typeof x.v==='number'?x.v:parseFloat(String(x.v).replace(',','.'));return isNaN(n)?null:n};
  let headerRow=-1,colDia=-1;
  for(let r=0;r<Math.min(rows.length,6);r++){for(let c=0;c<C;c++){if(norm(val(r,c))==='dia'){headerRow=r;colDia=c;break}}if(headerRow>=0)break}
  if(headerRow<0) throw new Error('Cabeçalho "Dia" não encontrado nessa aba');
  const headerMap={};
  for(let c=colDia;c<C;c++){const t=norm(val(headerRow,c));if(t)headerMap[t]=c}
  const colData=headerMap['data'], colFaltou=headerMap['faltou?'], colMetaDia=headerMap['meta dia'],
        colAcum=headerMap['acum. semana'], colSemana=headerMap['semana'];
  const colMetrica = colAcum!=null ? colAcum-1 : null;
  const dias=[];
  for(let r=headerRow+1;r<rows.length;r++){
    const dv=val(r,colDia); if(dv===''||dv==null) break;
    dias.push({dia:rawnum(r,colDia),data:val(r,colData),semana:colSemana!=null?rawnum(r,colSemana):null,
      realizado:colMetrica!=null?rawnum(r,colMetrica):null,acumSemana:colAcum!=null?rawnum(r,colAcum):null,
      faltou:colFaltou!=null?(norm(val(r,colFaltou))==='sim'||norm(val(r,colFaltou))==='x'):false,
      metaDia:colMetaDia!=null?rawnum(r,colMetaDia):null});
  }
  let resumoRow=-1,resumoCol=-1;
  for(let r=0;r<rows.length;r++){for(let c=0;c<C;c++){if(norm(val(r,c)).includes('resumo do mês')){resumoRow=r;resumoCol=c;break}}if(resumoRow>=0)break}
  if(resumoRow<0) throw new Error('Bloco "RESUMO DO MÊS" não encontrado nessa aba');
  const resumo={semanas:{}}; let mensagem='';
  for(let r=resumoRow+1;r<rows.length;r++){
    const label=norm(val(r,resumoCol)); const valor=val(r,resumoCol+1); const valor2=val(r,resumoCol+2);
    if(!label) continue;
    if(label==='meta mensal') resumo.metaMensal=rawnum(r,resumoCol+1);
    else if(label==='realizado (até hoje)') resumo.realizadoAteHoje=rawnum(r,resumoCol+1);
    else if(label==='realizado total no mês') resumo.realizadoTotal=rawnum(r,resumoCol+1);
    else if(label==='% atingido') resumo.pctAtingido=valor;
    else if(label==='projeção do mês (no ritmo)') resumo.projecao=rawnum(r,resumoCol+1);
    else if(label==='projeção / meta') resumo.pctProjecao=valor;
    else if(label==='total de faltas no mês') resumo.faltas=rawnum(r,resumoCol+1);
    else if(label==='desconto sobre o total') resumo.desconto=valor;
    else if(/^semana [1-5]$/.test(label)){ const n=label.split(' ')[1]; resumo.semanas[n]={bonus:valor,realMeta:valor2} }
    else if(label.includes('subtotal base')) resumo.bonusBase=valor;
    else if(label.includes('bônus extra')) resumo.bonusExtra=valor;
    else if(label.includes('total possível')) resumo.bonusTotal=valor;
    else if(!valor && label.length>15 && !mensagem) mensagem=val(r,resumoCol);
  }
  resumo.mensagem=mensagem;
  return {dias,resumo};
}

/* ============ FETCH ============ */
async function buscarAba(tab){
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(tab)}`;
  const res = await fetch(url);
  const raw = await res.text();
  const jsonText = raw.substring(raw.indexOf('{'), raw.lastIndexOf('}')+1);
  const data = JSON.parse(jsonText);
  if(data.status==='error') throw new Error(JSON.stringify(data.errors));
  return data.table;
}

/* ============ STATUS (cor decidida pela própria planilha, via emoji da mensagem) ============ */
function statusDe(mensagem){
  if(mensagem.includes('🟢')) return {cor:'mint', bg:'var(--mint-bg)', ink:'var(--mint)'};
  if(mensagem.includes('🔴')) return {cor:'coral', bg:'var(--coral-bg)', ink:'var(--coral)'};
  return {cor:'amber', bg:'var(--amber-bg)', ink:'var(--amber)'};
}

/* ============ RENDER ============ */
let chartRef = null;

function svgRing(pct, corVar){
  const r = 92, C = 2*Math.PI*r;
  const off = C - Math.min(pct,1)*C;
  return `<svg viewBox="0 0 216 216">
    <circle class="ring-bg" cx="108" cy="108" r="${r}"/>
    <circle class="ring-fg" cx="108" cy="108" r="${r}" stroke="${corVar}"
      stroke-dasharray="${C}" stroke-dashoffset="${C}" data-final="${off}"/>
  </svg>`;
}

function render(pessoa, parsed){
  const {dias, resumo} = parsed;
  const st = statusDe(resumo.mensagem || '');
  const pctNum = resumo.metaMensal ? Math.min(resumo.realizadoTotal/resumo.metaMensal, 1) : 0;
  const pctLabel = resumo.pctAtingido || Math.round(pctNum*100)+'%';

  // missão do dia
  const hoje = dias[dias.length-1];
  const faltamHoje = hoje ? Math.max(0, (hoje.metaDia||0) - (hoje.realizado||0)) : 0;
  const missaoOk = hoje && hoje.metaDia!=null && (hoje.realizado||0) >= hoje.metaDia;

  // semana atual: pega os dias da última "semana" registrada
  const semanaAtualNum = hoje ? hoje.semana : null;
  const diasSemana = dias.filter(d=>d.semana===semanaAtualNum);
  const nomesDias = ['D','S','T','Q','Q','S','S'];

  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="topbar">
      <div></div>
      <select id="seletor">${ABAS.map(a=>`<option value="${a.tab}" ${a.tab===pessoa.tab?'selected':''}>${a.nome}</option>`).join('')}</select>
    </div>
    <div class="greeting">${saudacao()}</div>
    <div class="nome">${pessoa.nome}</div>

    <div class="ringcard">
      <div class="ringwrap">
        ${svgRing(pctNum, `var(--${st.cor})`)}
        <div class="ringcenter">
          <div class="num">${resumo.realizadoTotal ?? '—'}</div>
          <div class="den">de ${resumo.metaMensal ?? '—'}</div>
          <div class="pct" style="background:${st.bg};color:${st.ink}">${pctLabel} do mês</div>
        </div>
      </div>
      <div class="label-meta">Meta do mês</div>
      ${resumo.mensagem ? `<div class="msg" style="color:${st.ink}">${resumo.mensagem}</div>` : ''}
    </div>

    <div class="section">Missão de hoje</div>
    <div class="card pad missao ${missaoOk?'done':''}">
      <div class="check">${missaoOk?'✓':'🎯'}</div>
      <div class="txt">
        ${missaoOk
          ? `<b>Meta de hoje batida!</b><div>Você já fez ${hoje?.realizado} — mandou bem.</div>`
          : `<b>Faltam ${faltamHoje}</b><div>pra bater a meta de hoje (${hoje?.metaDia ?? '—'}).</div>`}
      </div>
    </div>

    <div class="section">Bônus do mês</div>
    <div class="bonusgrid" style="border-radius:22px;overflow:hidden">
      <div class="cel"><div class="lbl">Base garantido</div><div class="v">${resumo.bonusBase ?? '—'}</div></div>
      <div class="cel"><div class="lbl">Bônus extra</div><div class="v">${resumo.bonusExtra ?? '—'}</div></div>
      <div class="cel"><div class="lbl">🏆 Total possível no mês</div><div class="v">${resumo.bonusTotal ?? '—'}</div></div>
    </div>

    <div class="section">Semana atual</div>
    <div class="card">
      <div class="semana">
        ${diasSemana.map(d=>{
          const dow = d.data ? new Date(d.data.split('/').reverse().join('-')+'T00:00:00') : null;
          const isHoje = d===hoje;
          let cls='cinza';
          if(isHoje) cls='azul';
          else if(d.metaDia!=null){ cls = (d.realizado||0)>=d.metaDia ? 'verde' : 'vermelho'; }
          return `<div class="diasq"><div class="sq ${cls}"></div><div class="dn">${d.data?d.data.split('/')[0]:''}</div></div>`;
        }).join('')}
      </div>
    </div>

    <div class="section">Bônus por semana</div>
    <div class="card">
      ${Object.entries(resumo.semanas).map(([n,s])=>`
        <div class="semrow">
          <div class="nm">Semana ${n}</div>
          <div class="pc">${s.realMeta||''}</div>
          <div class="bn">${s.bonus}</div>
        </div>`).join('')}
    </div>

    <div class="section">Evolução diária</div>
    <div class="card chartbox"><canvas id="grafico" height="160"></canvas></div>

    <div class="footer">Dados direto da planilha · pode levar alguns minutos pra atualizar</div>
  `;

  // anima o anel depois do paint
  requestAnimationFrame(()=>{
    const fg = app.querySelector('.ring-fg');
    requestAnimationFrame(()=>{ fg.style.strokeDashoffset = fg.dataset.final; });
  });

  document.getElementById('seletor').addEventListener('change', e=>{
    localStorage.setItem('metas_pessoa', e.target.value);
    carregar(e.target.value);
  });

  desenharGrafico(dias);
}

function saudacao(){
  const h = new Date().getHours();
  if(h<12) return 'Bom dia';
  if(h<18) return 'Boa tarde';
  return 'Boa noite';
}

function desenharGrafico(dias){
  const ctx = document.getElementById('grafico');
  if(!ctx || !window.Chart) return;
  if(chartRef) chartRef.destroy();
  chartRef = new Chart(ctx, {
    type:'line',
    data:{
      labels: dias.map(d=>d.data),
      datasets:[
        {label:'Realizado', data:dias.map(d=>d.realizado), borderColor:'#5B4FE0', backgroundColor:'rgba(91,79,224,.08)',
         fill:true, tension:.35, pointRadius:0, borderWidth:3},
        {label:'Meta do dia', data:dias.map(d=>d.metaDia), borderColor:'#B8862E', borderDash:[4,4],
         pointRadius:0, borderWidth:2, fill:false}
      ]
    },
    options:{
      responsive:true, maintainAspectRatio:false,
      plugins:{legend:{position:'bottom', labels:{font:{family:'Manrope',size:11,weight:600},boxWidth:10,usePointStyle:true}}},
      scales:{
        x:{ticks:{font:{size:9},maxRotation:0,autoSkip:true,maxTicksLimit:8},grid:{display:false}},
        y:{ticks:{font:{size:10}},grid:{color:'rgba(33,31,54,.06)'}}
      }
    }
  });
}

async function carregar(tab){
  const app = document.getElementById('app');
  app.innerHTML = '<div class="loading">Carregando seus números…</div>';
  const pessoa = ABAS.find(a=>a.tab===tab) || ABAS[0];
  try{
    const table = await buscarAba(pessoa.tab);
    const parsed = parseAbaIndividual(table);
    render(pessoa, parsed);
  }catch(e){
    app.innerHTML = `<div class="errbox">Não consegui ler essa aba.<br><br>${e.message}<br><br>Confere se a planilha está compartilhada como "Qualquer pessoa com o link → Leitor".</div>`;
  }
}

carregar(localStorage.getItem('metas_pessoa') || '5_SDR');
</script>
</body>
</html>
